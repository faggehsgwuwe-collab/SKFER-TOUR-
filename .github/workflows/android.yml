name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir -p www && cp index.html firebase-messaging-sw.js www/
      - run: npm install
      - run: npx cap add android
      - run: pip install pillow
      - name: Set app icon
        run: |
          python3 - << 'EOF'
          from PIL import Image
          import os, glob
          src = Image.open("icon-only.png").convert("RGBA")
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          res = "android/app/src/main/res"
          for d, px in sizes.items():
              folder = res + "/mipmap-" + d
              os.makedirs(folder, exist_ok=True)
              im = src.resize((px, px), Image.LANCZOS)
              im.save(folder + "/ic_launcher.png")
              im.save(folder + "/ic_launcher_round.png")
          for f in glob.glob(res + "/mipmap-anydpi-v26/*"):
              os.remove(f)
          print("icons written")
          EOF
      - run: cp google-services.json android/app/google-services.json
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: skfer-tour-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
