name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir -p www && cp index.html firebase-messaging-sw.js www/
      - run: npm install
      - run: npx cap add android
      - run: mkdir -p assets && cp icon-only.png assets/icon-only.png
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000'
      - run: cp google-services.json android/app/google-services.json
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: skfer-tour-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
